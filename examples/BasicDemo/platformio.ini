; PlatformIO project configuration for BasicDemo.ino
; Detailed explanation / background: see ../../PLATFORMIO.md
;
; Two environments, because (as of 2026) there are two common ways to get
; an ESP32 Arduino core under PlatformIO — and this library supports both
; automatically (see ../../src/ESP32C3LEDManager.h):
;
;   core3 -> Arduino-ESP32 Core >= 3.0 (ESP-IDF 5.x, new pin-based LEDC
;            API) via the "pioarduino" community fork, since the official
;            PlatformIO Registry package "espressif32" hasn't been updated
;            to Core 3.x for quite a while.
;   core2 -> Arduino-ESP32 Core 2.x (ESP-IDF 4.4, old channel-based LEDC
;            API), as still installed by the default setup
;            "platform = espressif32" from the official PlatformIO
;            Registry — exactly the combination under which GitHub
;            Issue #1 occurred.
;
; Usage (from this folder):  pio run -e core3   or   pio run -e core2

[platformio]
default_envs = core3

[env]
framework = arduino
board = esp32-c3-devkitm-1
; Generic ESP32-C3 devkit board definition. There is no dedicated entry for
; the SuperMini(-Plus) at Espressif/PlatformIO; this definition matches
; electrically (same chip, same base pinout).
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1  ; needed so Serial.print() reaches you over USB-CDC
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0
    symlink://../..   ; ESP32C3LEDManager itself (repo root)

[env:core3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.03/platform-espressif32.zip
; pioarduino release 51.03.03 bundles Arduino-ESP32 3.0.3 (ESP-IDF 5.1).
; -> uses the new, pin-based LEDC API internally (ledcAttach/ledcDetach).

[env:core2]
platform = espressif32
; Official PlatformIO Registry package. As of this writing: Arduino-ESP32
; 2.0.17 (ESP-IDF 4.4).
; -> uses the old, channel-based LEDC API internally (ledcSetup/ledcAttachPin).
