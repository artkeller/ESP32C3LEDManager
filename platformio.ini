; PlatformIO-Projektkonfiguration für dieses Repository.
; Ausführliche Erklärung / Hintergrund: siehe PLATFORMIO.md
;
; "pio run" im Repo-Root baut standardmäßig examples/BasicDemo.
; Für FullDemo bitte direkt in den Beispiel-Ordner wechseln:
;   cd examples/FullDemo && pio run
; (jedes Beispiel hat dort seine eigene, identisch aufgebaute platformio.ini)
;
; Zwei Environments, weil es (Stand 2026) zwei gängige Wege gibt, unter
; PlatformIO an einen ESP32-Arduino-Core zu kommen — und diese Bibliothek
; beide automatisch unterstützt (siehe src/ESP32C3LEDManager.h):
;
;   core3 -> Arduino-ESP32 Core >= 3.0 (ESP-IDF 5.x, neue pin-basierte
;            LEDC-API) über den Community-Fork "pioarduino", da das
;            offizielle PlatformIO-Registry-Package "espressif32" seit
;            geraumer Zeit nicht mehr auf Core 3.x aktualisiert wurde.
;   core2 -> Arduino-ESP32 Core 2.x (ESP-IDF 4.4, alte kanalbasierte
;            LEDC-API), wie er beim Standard-Setup
;            "platform = espressif32" aus der offiziellen PlatformIO
;            Registry nach wie vor installiert wird — genau die
;            Kombination, unter der GitHub-Issue #1 aufgetreten ist.
;
; Aufruf:  pio run -e core3   bzw.   pio run -e core2

[platformio]
default_envs = core3
src_dir = examples/BasicDemo

[env]
framework = arduino
board = esp32-c3-devkitm-1
; Generische ESP32-C3-DevKit-Board-Definition. Für das SuperMini(-Plus)
; gibt es keinen eigenen Eintrag bei Espressif/PlatformIO; die Definition
; passt elektrisch (gleicher Chip, gleiches Pinout-Grundschema).
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1  ; nötig, damit Serial.print() über USB-CDC ankommt
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0
    symlink://.   ; diese Bibliothek selbst (Repo-Root, enthält library.properties + src/)

[env:core3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.03/platform-espressif32.zip
; pioarduino-Release 51.03.03 bündelt Arduino-ESP32 3.0.3 (ESP-IDF 5.1).
; -> nutzt intern die neue, pin-basierte LEDC-API (ledcAttach/ledcDetach).

[env:core2]
platform = espressif32
; Offizielles PlatformIO-Registry-Package. Stand dieser Doku: Arduino-ESP32
; 2.0.17 (ESP-IDF 4.4).
; -> nutzt intern die alte, kanalbasierte LEDC-API (ledcSetup/ledcAttachPin).
